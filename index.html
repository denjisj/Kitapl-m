<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Kitaplığım</title>
<style>
:root{
  --bg:#f6f3ee;--card:#fffdfa;--ink:#1c1b19;--ink2:#3d3a35;--mu:#7b766e;--mu2:#a8a299;--line:#e6e0d6;--fill:#efebe4;
  --ac:#1f5f4e;--ac-ink:#fff;--ac-soft:#e2ece8;--star:#e3a417;--red:#b03a2e;
  --read:#2f7d4f;--reading:#b7791f;--want:#3b5fa8;
  --shadow:0 1px 2px rgba(40,30,10,.08),0 6px 18px rgba(40,30,10,.08);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131312;--card:#1c1b19;--ink:#efebe4;--ink2:#cfc9bf;--mu:#99938a;--mu2:#6e6961;--line:#2c2a27;--fill:#252421;
  --ac:#6cbfa3;--ac-ink:#0d1f19;--ac-soft:#1c2c27;--read:#6cbf8a;--reading:#e0a64a;--want:#86a6ea;--red:#e2685b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--ac)}
img{display:block}
.hide{display:none!important}

/* --- üst ve sekmeler --- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(10px + var(--st)) 20px 8px;border-bottom:1px solid transparent;transition:border-color .2s}
header.sc{border-color:var(--line)}
.hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
header h1{font:700 30px/1.1 var(--sans);letter-spacing:-.02em;margin:0;flex:1;min-width:0}
header.sub h1{font:600 17px/1.3 var(--sans);letter-spacing:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.sub .hbtn{visibility:hidden}
.back{display:flex;align-items:center;gap:2px;color:var(--ac);font-size:17px;margin-left:-8px;min-width:70px;height:38px}
.back svg{width:24px;height:24px}
main.pg{animation:pg .22s ease-out}
@keyframes pg{from{opacity:.4;transform:translateX(10px)}}
.crumb{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 4px}
.hbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.hbtn:active{background:var(--fill)}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mu)}
main{max-width:760px;margin:0 auto;padding:4px 20px calc(140px + var(--sb))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding:6px 0 calc(4px + var(--sb))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--mu2);padding:4px 0}
nav.tabs svg{width:25px;height:25px}
nav.tabs button.on{color:var(--ac)}

/* --- genel --- */
.ic{width:22px;height:22px;flex:none}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:6px 0 16px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:0 12px;height:40px;margin:4px 0 12px}
.search svg{width:18px;height:18px;color:var(--mu);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 14px;padding:0 20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;font-size:14px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--card)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters button span{color:var(--mu);margin-left:3px}
.filters button.on span{color:var(--mu2)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px;color:var(--mu);font-size:13px}
.toolbar select{border:0;background:none;color:var(--ac);font-weight:500;font-size:13px;-webkit-appearance:none;appearance:none;text-align:right}
.tgl{display:flex;gap:2px}
.tgl button{width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mu2)}
.tgl button.on{color:var(--ink);background:var(--fill)}
.tgl svg{width:18px;height:18px}
h2.sec{font:700 21px/1.2 var(--sans);letter-spacing:-.01em;margin:22px 0 12px;display:flex;align-items:baseline;justify-content:space-between}
h2.sec small{font:400 14px var(--sans);color:var(--mu)}
.muted{color:var(--mu)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:12px;background:var(--fill);font-weight:600;font-size:15px;color:var(--ink)}
.btn.pri{background:var(--ac);color:var(--ac-ink)}
.btn.out{background:transparent;border:1px solid var(--line)}
.btn.red{color:var(--red)}
.btn.sm{height:34px;padding:0 13px;font-size:14px;border-radius:9px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
label.f{display:block;font-size:13px;color:var(--mu);margin:14px 0 5px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;font-size:16px}
.inp:focus{border-color:var(--ac)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.empty{text-align:center;padding:48px 24px;color:var(--mu)}
.empty h3{font:600 19px var(--sans);color:var(--ink);margin:12px 0 6px}
.empty svg{width:46px;height:46px;color:var(--mu2)}
.spin{width:20px;height:20px;border:2.2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:var(--mu);font-size:14px}

/* --- kapak --- */
.cv{position:relative;flex:none;border-radius:3px;overflow:hidden;background:var(--fill);box-shadow:var(--shadow)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .ph{position:absolute;inset:0;padding:12% 10%;display:flex;flex-direction:column;justify-content:space-between;color:rgba(255,255,255,.93);border-left:4px solid rgba(0,0,0,.18)}
.cv .ph b{font:600 1em/1.12 var(--serif);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cv .ph i{font-style:normal;font-size:.72em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .ph:after{content:"";position:absolute;left:10%;right:10%;top:52%;height:1px;background:rgba(255,255,255,.35)}
.cv:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(255,255,255,.06) 4%,transparent 7%);}

/* --- ızgara ve liste --- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 16px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:720px){.grid{grid-template-columns:repeat(5,1fr)}}
.gi{text-align:left;min-width:0}
.gi .cv{width:100%!important;height:auto!important;aspect-ratio:2/3}
.gi .t{font-size:13.5px;font-weight:600;line-height:1.25;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gi .a{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gi .m{margin-top:3px;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mu)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.d-okudum{background:var(--read)}.d-okuyorum{background:var(--reading)}.d-okuyacagim{background:var(--want)}
.list{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.li{display:flex;gap:14px;align-items:center;padding:12px 14px;width:100%;text-align:left;position:relative}
.li+.li:before{content:"";position:absolute;top:0;right:0;left:82px;height:1px;background:var(--line)}
.li:active{background:var(--fill)}
.li .bd{flex:1;min-width:0}
.li .t{font-weight:600;font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .a{color:var(--mu);font-size:14px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--mu);margin-top:5px}
.li .r{flex:none;color:var(--mu2)}
.li .num{width:26px;flex:none;text-align:center;font:600 17px var(--serif);color:var(--mu)}
.chev{width:16px;height:16px;color:var(--mu2);flex:none}
.st{display:inline-flex;align-items:center;gap:5px}
.bar{height:3px;background:var(--fill);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
.shelf{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf .gi{flex:none;width:104px}

/* --- yıldızlar --- */
.stars{position:relative;display:inline-block;line-height:1;letter-spacing:1px;color:var(--line);white-space:nowrap}
.stars .on{position:absolute;left:0;top:0;overflow:hidden;color:var(--star)}
.rater{display:flex;align-items:center;gap:14px}
.rater .stars{font-size:38px;letter-spacing:4px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.rater .val{font:600 26px var(--serif);min-width:46px}

/* --- alt sayfa --- */
.sw{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sw[hidden]{display:none}
.sw .bk{position:absolute;inset:0;background:rgba(0,0,0,.38);animation:fd .2s}
.sheet{position:relative;width:100%;max-width:640px;max-height:93vh;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:6px 20px calc(28px + var(--sb));animation:up .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.shd{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px;min-height:36px}
.shd h3{font:600 17px var(--sans);margin:0}
.shd .x{color:var(--ac);font-weight:500;font-size:16px;padding:6px 2px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.group .gh{font-size:12.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px 0}
.group .gb{padding:10px 16px 14px}
.row{display:flex;align-items:center;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;position:relative;font-size:16px}
.opt+.opt:before{content:"";position:absolute;top:0;right:0;left:56px;height:1px;background:var(--line)}
.opt svg.ic{color:var(--ac)}
.opt .d{flex:1}
.opt .d small{display:block;color:var(--mu);font-size:13px;margin-top:1px}
.opt:active{background:var(--fill)}

/* --- kitap detay --- */
.dh{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 4px}
.dh h2{font:600 24px/1.2 var(--serif);margin:16px 0 4px;letter-spacing:-.005em}
.dh .au{color:var(--ink2);font-size:16px}
.facts{display:flex;justify-content:center;gap:0;margin:16px 0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{flex:1;padding:10px 4px;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts b{display:block;font-size:15px;font-weight:600}
.facts span{font-size:11.5px;color:var(--mu)}
.status3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.status3 button{padding:10px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink2)}
.status3 button.on{color:#fff;border-color:transparent}
.status3 button.on.okudum{background:var(--read)}.status3 button.on.okuyorum{background:var(--reading)}.status3 button.on.okuyacagim{background:var(--want)}
@media (prefers-color-scheme:dark){.status3 button.on{color:#111}}
.desc{font:15.5px/1.6 var(--serif);color:var(--ink2);position:relative}
.desc.cl{max-height:7.6em;overflow:hidden}
.desc.cl:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.4em;background:linear-gradient(transparent,var(--card))}
.rev{padding:12px 0;border-top:1px solid var(--line)}
.rev:first-child{border:0;padding-top:2px}
.rev .who{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.rev .who .avatar{width:28px;height:28px}
.rev .who small{font-weight:400;color:var(--mu);margin-left:auto}
.rev p{margin:7px 0 0;font:15px/1.55 var(--serif);color:var(--ink2);white-space:pre-wrap}
.sw2{position:relative;width:46px;height:28px;flex:none}
.sw2 input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw2 span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw2 span:after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw2 input:checked+span{background:var(--ac)}
.sw2 input:checked+span:after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--ac)}

/* --- tarayıcı --- */
#scan{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column}
#scan[hidden]{display:none}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--st)) 18px 14px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#scan .top button{color:#fff;font-size:16px;font-weight:500}
#scan .win{position:relative;z-index:1;margin:auto;width:78%;max-width:360px;aspect-ratio:1.7;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
#scan .win:before,#scan .win:after{content:"";position:absolute;inset:-2px;border-radius:16px;border:3px solid #fff;-webkit-mask:linear-gradient(#000 0 0) top/100% 26% no-repeat,linear-gradient(#000 0 0) bottom/100% 26% no-repeat;mask:linear-gradient(#000 0 0) top/100% 26% no-repeat,linear-gradient(#000 0 0) bottom/100% 26% no-repeat}
#scan .win:after{-webkit-mask:linear-gradient(#000 0 0) left/14% 100% no-repeat,linear-gradient(#000 0 0) right/14% 100% no-repeat;mask:linear-gradient(#000 0 0) left/14% 100% no-repeat,linear-gradient(#000 0 0) right/14% 100% no-repeat}
#scan .laser{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff4d3d;box-shadow:0 0 12px #ff4d3d;animation:ls 1.6s ease-in-out infinite}
@keyframes ls{50%{top:20%}}
#scan .bot{position:relative;z-index:2;padding:18px 20px calc(22px + var(--sb));text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.75))}
#scan .bot p{margin:0 0 14px;font-size:15px;opacity:.9}
#scan .bot .row{justify-content:center}
#scan .bot{padding-top:10px}
#scan .bot p{min-height:22px;transition:color .2s}
#scan .bot p.ok{color:#7ee2a8}#scan .bot p.warn{color:#ffd27a}
.sst{display:flex;gap:4px;justify-content:center;margin:0 0 10px}
.sst button{font-size:13px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-weight:500}
.sst button.on{background:#fff;color:#111;font-weight:600}
.tray{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;min-height:0;scrollbar-width:none;justify-content:flex-start}
.tray::-webkit-scrollbar{display:none}
.tray:empty{display:none}
.ti{position:relative;flex:none;width:46px;text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ti .cv{width:46px!important;height:69px!important;font-size:7px!important;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.ti .st{position:absolute;right:-5px;top:-5px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid #000;z-index:3}
.ti .st.ok{background:#2f9d5f}.ti .st.var{background:#5b6b8a}.ti .st.yok{background:#c0392b}.ti .st.ara{background:#555}
.ti .st.ara:after{content:"";width:9px;height:9px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
.ti.iptal{opacity:.3}
.isbnbar{display:flex;gap:8px;margin:0 0 10px}
.isbnbar input{flex:1;min-width:0;height:36px;border-radius:9px;border:0;padding:0 12px;font-size:16px;background:rgba(255,255,255,.92);color:#111}
#scan .btn.done{background:#fff!important;color:#111!important}
#scan .bot .btn{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#scan .flash{position:absolute;inset:0;z-index:3;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}

/* --- oynatıcı --- */
.mini{position:fixed;left:8px;right:8px;bottom:calc(64px + var(--sb));z-index:29;max-width:744px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);text-align:left;overflow:hidden}
.mini[hidden]{display:none}
.mini .bd{flex:1;min-width:0}
.mini b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mini .pg{position:absolute;left:0;bottom:0;height:2px;background:var(--ac)}
.pp{width:40px;height:40px;display:grid;place-items:center;color:var(--ink);flex:none}
.pp svg{width:26px;height:26px}
.player{text-align:center}
.player .cvw{display:flex;justify-content:center;margin:10px 0 18px}
.player h2{font:600 22px/1.2 var(--serif);margin:0}
.player .ctl{display:flex;justify-content:center;align-items:center;gap:34px;margin:12px 0 18px}
.player .big{width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.player .big svg{width:34px;height:34px}
.player .skp{color:var(--ink);position:relative;width:44px;height:44px;display:grid;place-items:center}
.player .skp svg{width:38px;height:38px}
.player .skp em{position:absolute;font-style:normal;font-size:10.5px;font-weight:700;top:16px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;margin-top:2px}
.chip2{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--fill);font-size:13.5px;font-weight:500}
.ch{display:flex;gap:12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.ch .n{width:24px;color:var(--mu);font-variant-numeric:tabular-nums}
.ch.on{color:var(--ac);font-weight:600}

function gbMap(it){const v=it.volumeInfo||{};const ids=v.industryIdentifiers||[];
  const isbn=((ids.find(x=>x.type==='ISBN_13')||ids.find(x=>x.type==='ISBN_10')||{}).identifier)||'';
  let img=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)||'';
  if(img)img=img.replace(/^http:/,'https:').replace('&edge=curl','')+'&fife=w480-h720';
  else if(isbn)img=`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;
  return{baslik:v.title||'',yazar:(v.authors||[]).join(', '),yayinevi:v.publisher||'',yil:(v.publishedDate||'').slice(0,4),sayfa:v.pageCount||null,kapak:img,aciklama:stripHtml(v.description),tur:(v.categories||[])[0]||'',isbn}}
let GB_DOWN_UNTIL=0;
async function gbSearch(q,max=20){
  if(Date.now()<GB_DOWN_UNTIL)throw new Error('gb limit');
  const r=await fetch(`${GB}?q=${encodeURIComponent(q)}&maxResults=${max}&printType=books${gbKey()}`);
  if(r.status===429||r.status===403){GB_DOWN_UNTIL=Date.now()+5*60000;throw new Error('gb limit')}
  if(!r.ok)throw new Error('gb '+r.status);const j=await r.json();return(j.items||[]).map(gbMap).filter(x=>x.baslik)}
const OLF='key,title,author_name,first_publish_year,publisher,number_of_pages_median,cover_i,isbn';
function olMap(d){return{baslik:d.title||'',yazar:(d.author_name||[]).slice(0,3).join(', '),yayinevi:(d.publisher||[])[0]||'',yil:String(d.first_publish_year||''),sayfa:d.number_of_pages_median||null,
  kapak:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:'',aciklama:'',tur:'',isbn:((d.isbn||[]).find(x=>/^97[89]/.test(x))||'')}}
async function olSearch(params,max=20){const r=await fetch(`https://openlibrary.org/search.json?${params}&limit=${max}&fields=${OLF}`);if(!r.ok)throw new Error('ol '+r.status);const j=await r.json();return(j.docs||[]).map(olMap).filter(x=>x.baslik)}

  if(L.length<4){try{const o=await olSearch('q='+encodeURIComponent(q),20);L=L.concat(o);ok=true}catch(e){}}
  if(!ok)throw new Error('ag');

async function olIsbn(isbn){try{const r=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);const j=await r.json();const d=j['ISBN:'+isbn];if(!d)return null;
  return{baslik:d.title||'',yazar:(d.authors||[]).map(a=>a.name).join(', '),yayinevi:((d.publishers||[])[0]||{}).name||'',yil:((d.publish_date||'').match(/\d{4}/)||[''])[0],sayfa:d.number_of_pages||null,kapak:(d.cover&&(d.cover.large||d.cover.medium))||'',aciklama:'',tur:((d.subjects||[])[0]||{}).name||'',isbn}}catch(e){return null}}
function isbn10(i13){if(!/^978\d{10}$/.test(i13))return null;const c=i13.slice(3,12);let t=0;for(let i=0;i<9;i++)t+=(10-i)*+c[i];const d=(11-t%11)%11;return c+(d===10?'X':String(d))}
async function crowdIsbn(isbn,i10){if(LOCAL||!sb)return null;
  try{const{data}=await sb.from('kitaplik').select('baslik,yazar,yayinevi,yil,sayfa,kapak,aciklama,tur,isbn').in('isbn',[isbn,i10].filter(Boolean)).limit(5);
    const L=(data||[]).filter(x=>x.baslik);if(!L.length)return null;return L.sort((a,b)=>(!!b.kapak-!!a.kapak)||((b.sayfa||0)?1:0)-((a.sayfa||0)?1:0))[0]}catch(e){return null}}
const ISBNC={};
async function lookupIsbn(isbn){
  if(ISBNC[isbn])return ISBNC[isbn];
  const i10=isbn10(isbn);const safe=p=>p.catch(()=>null);
  const own=S.lib.find(b=>b.isbn===isbn||(i10&&b.isbn===i10));if(own)return own;
  const[cr,g13,g10,o13,o10]=await Promise.all([
    safe(crowdIsbn(isbn,i10)),
    safe(gbSearch('isbn:'+isbn,2).then(r=>r[0]||null)),
    i10?safe(gbSearch('isbn:'+i10,2).then(r=>r[0]||null)):null,
    safe(olIsbn(isbn)),
    i10?safe(olIsbn(i10)):null]);
  let a=cr||g13||g10||null;
  if(!a){try{a=(await gbSearch(isbn,5)).find(x=>x.isbn===isbn||x.isbn===i10)||null}catch(e){}}
  const o=o13||o10;if(!a&&!o){try{a=(await olSearch('isbn='+isbn,1))[0]||null}catch(e){}}
  if(!a)a=o;else if(o){a.sayfa=a.sayfa||o.sayfa;a.yayinevi=a.yayinevi||o.yayinevi;if(o.kapak&&!(a.kapak||'').includes('books.google'))a.kapak=a.kapak||o.kapak}
  if(a){a={...a,isbn};if(!a.kapak)a.kapak=`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;ISBNC[isbn]=a}
  return a;
}

async function findCover(t,a){const k=keyOf(t,a);const c=COVERS[k];
  if(c&&typeof c==='object'){if(c.u||Date.now()-c.t<3*86400000)return c.u}else if(typeof c==='string'&&c)return c;
  let url='',answered=false;
  try{const r=await gbSearch(`intitle:${t}${a?' inauthor:'+surname(a):''}`,5);answered=true;const hit=r.find(x=>x.kapak&&x.kapak.includes('books.google'));url=hit?hit.kapak:''}catch(e){}

  return url}

function dbMsg(e){if(!e)return'';const m=(e.message||'')+' '+(e.code||'');
  if(/42P01|PGRST205|does not exist|Could not find the table/i.test(m))return'Veritabanı tabloları yok: Supabase SQL Editor’de kurulum.sql’i çalıştır.';
  if(/23505|duplicate key|kullanici_adi_uniq/i.test(m))return'Bu kullanıcı adı alınmış, başka bir tane dene.';
  if(/kullanici_adi_bicim|23514/i.test(m))return'Kullanıcı adı 3-20 karakter olmalı: küçük harf, rakam, _ ve .';
  if(/kullanici_adi.*(column|does not exist)|column.*kullanici_adi/i.test(m))return'Kullanıcı adı alanı yok: guncelleme-3.sql’i çalıştır.';
  if(/23503|foreign key/i.test(m))return'Profil kaydı eksik. Çıkış yapıp tekrar giriş yap.';
  if(/42501|row-level security|permission/i.test(m))return'Yetki hatası (RLS). kurulum.sql’i tekrar çalıştır ve yeniden giriş yap.';
  if(/JWT|apikey|Invalid API key/i.test(m))return'Supabase anahtarı hatalı. AYAR kısmındaki SUPABASE_ANON_KEY’i kontrol et.';
  return e.message||'Bilinmeyen hata'}

async function uploadAvatar(f){

  const m=Math.min(img.naturalWidth,img.naturalHeight),c=document.createElement('canvas');c.width=c.height=320;

  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));toast('Fotoğraf yükleniyor…');
  const path=`${S.me.id}/${Date.now().toString(36)}.jpg`;const up=await sb.storage.from('avatarlar').upload(path,blob,{contentType:'image/jpeg'});

  const url=sb.storage.from('avatarlar').getPublicUrl(path).data.publicUrl;

const BOOKC=(()=>{try{return JSON.parse(sessionStorage.getItem('kv.bookc')||'{}')}catch(e){return{}}})();
function openBook(x){if(!x)return;const k=x.anahtar||keyOf(x.baslik,x.yazar);if(!inLib(k)){BOOKC[k]={...x,anahtar:k};try{sessionStorage.setItem('kv.bookc',JSON.stringify(BOOKC))}catch(e){}}
  go('#/kitap/'+encodeURIComponent(k))}
async function fetchCand(k){
  let x=null;try{const{data}=await sb.from('kitap_istatistik').select('*').eq('anahtar',k).maybeSingle();if(data)x={...data}}catch(e){}
  const t=x?x.baslik:k.split('|')[0],a=x?x.yazar||'':k.split('|')[1]||'';
  try{const r=await searchBooks(`${t} ${a}`.trim());const h=r.find(y=>keyOf(y.baslik,y.yazar)===k)||r[0];if(h)x={...h,...(x||{}),aciklama:h.aciklama,sayfa:h.sayfa,yayinevi:h.yayinevi,yil:h.yil,kapak:(x&&x.kapak)||h.kapak}}catch(e){}
  if(!x)x={baslik:t,yazar:a};x.anahtar=k;BOOKC[k]=x;return x}
function vBook(k){
  S.openKey=k;const b=inLib(k);let x=b||BOOKC[k];const v=$('#view');
  if(!x){v.innerHTML=`<div class="loading" style="padding:60px 0"><span class="spin"></span> Kitap yükleniyor</div>`;fetchCand(k).then(()=>{if(R.name==='kitap'&&R.arg===k)render()});return}
  const d=x;$('#ttl').textContent=d.baslik||'';
  const facts=[d.sayfa?[d.sayfa,'sayfa']:null,d.yil?[d.yil,'yıl']:null,d.yayinevi?[d.yayinevi,'yayınevi']:null].filter(Boolean);
  const more=d.yazar?`<div class="group"><div class="gh">Yazarın diğer kitapları</div><div class="gb" style="padding:12px 0 6px"><div class="shelf" id="byAuthor" style="margin:0;padding:2px 16px 8px"><div class="loading" style="padding:10px"><span class="spin"></span></div></div></div></div>`:'';
  v.innerHTML=`<div class="dh">${cover(d,140)}<h2>${esc(d.baslik)}</h2><div class="au">${esc(d.yazar||'')}</div><div id="comStat" class="small muted" style="margin-top:6px;min-height:18px"></div></div>

  ${b?`<div class="group"><div class="gh">Durum</div><div class="gb"><div class="status3">${Object.entries(DURUM).map(([k2,t])=>`<button class="${k2} ${b.durum===k2?'on':''}" data-act="setDurum" data-s="${k2}">${t}</button>`).join('')}</div>
    ${b.durum==='okuyorum'&&b.sayfa?`<div style="margin-top:14px"><div class="row small" style="justify-content:space-between"><span>Sayfa ${b.mevcut_sayfa||0} / ${b.sayfa}</span><span class="muted">%${Math.round((b.mevcut_sayfa||0)/b.sayfa*100)}</span></div><input type="range" min="0" max="${b.sayfa}" value="${b.mevcut_sayfa||0}" data-chg="sayfaIlerleme"></div>`:''}</div></div>
    <div class="group"><div class="gh">Puanım</div><div class="gb"><div class="rater"><span class="stars" id="rater" style="font-size:38px">★★★★★<span class="on" style="width:${(b.puan||0)/5*100}%">★★★★★</span></span><span class="val" id="raterV">${b.puan>0?rate1(b.puan):''}</span></div><div class="small muted" style="margin-top:4px">${b.puan>0?`<button data-act="clearRate" style="color:var(--ac)">Puanı kaldır</button>`:'Yıldızın sol yarısına dokunursan yarım puan verirsin.'}</div></div></div>
    <div class="group"><div class="gh">Yorumum</div><div class="gb"><textarea class="inp" id="revIn" placeholder="Bu kitap hakkında düşüncelerin…">${esc(b.yorum||'')}</textarea><div class="row" style="justify-content:space-between;margin-top:10px"><label class="row small" style="gap:10px"><span class="sw2"><input type="checkbox" id="revPub" ${(b.yorum?b.yorum_acik!==false:(S.profile||{}).yorumlar_acik!==false)?'checked':''}><span></span></span>Diğer okurlar görsün</label><button class="btn pri sm" data-act="saveRev">Kaydet</button></div></div></div>`
  :`<div class="group"><div class="gh">Kitaplığına ekle</div><div class="gb"><div class="status3">${Object.entries(DURUM).map(([k2,t])=>`<button class="${k2}" data-act="addCand" data-s="${k2}">${t}</button>`).join('')}</div></div></div>`}

  window._cand=x;
  if(b){const r=$('#rater');if(r)r.addEventListener('pointerdown',rateHandler)}
  loadCommunity(k);if(d.yazar)loadByAuthor(d.yazar,k);
}
const AUTH={};
async function loadByAuthor(a,k){const key=surname(a);let L=AUTH[key];
  if(!L){try{L=(await searchBooks(`inauthor:${a.split(',')[0]}`)).filter(y=>y.kapak&&surname(y.yazar)===key)}catch(e){L=[]}
    const seen=new Set();L=L.filter(y=>{const kk=keyOf(y.baslik,y.yazar);if(seen.has(kk))return false;seen.add(kk);return true}).slice(0,12);AUTH[key]=L}
  const el=$('#byAuthor');if(!el||S.openKey!==k)return;const L2=L.filter(y=>keyOf(y.baslik,y.yazar)!==k);
  if(!L2.length){el.closest('.group').remove();return}
  window._auth=L2;el.innerHTML=L2.map((y,i)=>`<button class="gi" data-act="openAuth" data-i="${i}">${cover(y,92)}<div class="t">${esc(y.baslik)}</div><div class="a">${esc(y.yil||'')}</div></button>`).join('')}
function rateHandler(e){const r=e.currentTarget,box=r.getBoundingClientRect();const step=v=>Math.max(.5,Math.min(5,Math.ceil((v-box.left)/box.width*10)/2));
  const set=v=>{r.querySelector('.on').style.width=v/5*100+'%';$('#raterV').textContent=rate1(v)};let val=step(e.clientX);set(val);r.setPointerCapture(e.pointerId);
  const mv=ev=>{val=step(ev.clientX);set(val)};const up=async()=>{r.removeEventListener('pointermove',mv);r.removeEventListener('pointerup',up);const b=inLib(S.openKey);if(!b)return;
    const p={puan:val};if(b.durum==='okuyacagim'){p.durum='okudum';p.bitis=b.bitis||today()}await saveRow(b,p);S.stats=null;toast(`${rate1(val)} puan verdin`);render()};
  r.addEventListener('pointermove',mv);r.addEventListener('pointerup',up)}
async function loadCommunity(k){
  const[st,rv]=await Promise.all([sb.from('kitap_istatistik').select('*').eq('anahtar',k).maybeSingle(),
    sb.from('kitaplik').select('puan,yorum,updated_at,user_id,yorum_acik,profiller(id,ad,avatar)').eq('anahtar',k).not('yorum','is',null).neq('yorum','').order('updated_at',{ascending:false}).limit(60)]);
  if(S.openKey!==k)return;const s=st.data;
  const cs=$('#comStat');if(cs&&s)cs.innerHTML=[s.ort_puan?`${stars(s.ort_puan,13)} <b style="color:var(--ink)">${rate1(s.ort_puan)}</b> (${s.puan_sayisi} puan)`:'',s.okuyan?`${s.okuyan} kişi okudu`:''].filter(Boolean).join(' · ');
  let L=(rv.data||[]).filter(r=>r.yorum_acik!==false&&(!S.me||r.user_id!==S.me.id));
  const mine=inLib(k);if(mine&&mine.yorum)L.unshift({...mine,mine:true,profiller:S.profile||{}});
  const el=$('#revs');if(!el)return;
  el.innerHTML=L.length?L.map(r=>{const p=r.profiller||{};const to=r.mine?'#/profil':'#/kullanici/'+r.user_id;
    return `<div class="rev"><div class="who"><a href="${to}" style="display:contents;color:inherit;text-decoration:none">${av(p,28)}<span class="ulink">${esc(r.mine?'Sen':p.ad||'Okur')}</span></a>${r.puan>0?` ${stars(r.puan,12)}<span class="rnum">${rate1(r.puan)}</span>`:''}${r.mine&&r.yorum_acik===false?'<span class="tag">sadece sen görürsün</span>':''}<small>${ago(r.updated_at)}</small></div><p>${esc(r.yorum)}</p></div>`}).join('')
    :`<div class="small muted">Henüz yorum yok.${inLib(k)?' İlk yorumu sen yaz.':''}</div>`;
}

function validIsbn(s){if(!/^97[89]\d{10}$/.test(s))return false;let t=0;for(let i=0;i<12;i++)t+=+s[i]*(i%2?3:1);return(10-t%10)%10===+s[12]}
let zxReader=null;
function zx(){if(zxReader)return zxReader;const h=new Map();h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]);h.set(ZXing.DecodeHintType.TRY_HARDER,true);zxReader=new ZXing.MultiFormatReader();zxReader.setHints(h);return zxReader}
function zxDecodeCanvas(c){try{const t=zx().decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText();return validIsbn(t)?t:null}catch(e){return null}}
const scanCv=document.createElement('canvas');const scanCtx=scanCv.getContext('2d',{willReadFrequently:true});
let DET=null;
async function getDetector(){if(DET)return DET;
  try{if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('ean_13')){DET={d:new BarcodeDetector({formats:['ean_13']}),kind:'native'};return DET}}catch(e){}
  try{if(window.BarcodeDetectionAPI){const d=new BarcodeDetectionAPI.BarcodeDetector({formats:['ean_13','ean_8','upc_a']});await d.detect(new ImageData(16,16));DET={d,kind:'wasm'};return DET}}catch(e){console.warn('wasm okuyucu',e)}
  DET={d:null,kind:'js'};return DET}
const bandCv=document.createElement('canvas');const bandCtx=bandCv.getContext('2d',{willReadFrequently:true});
function grabBand(video,mode){const vw=video.videoWidth,vh=video.videoHeight;if(!vw)return null;
  let sx=0,sy=0,sw=vw,sh=vh;
  if(mode===1){sh=vh*.5;sy=(vh-sh)/2}
  else if(mode===2){sw=vw*.5;sh=vh*.4;sx=(vw-sw)/2;sy=(vh-sh)/2}
  const sc=mode===2?Math.min(2,1200/sw):Math.min(1,1920/sw);bandCv.width=Math.round(sw*sc);bandCv.height=Math.round(sh*sc);
  bandCtx.drawImage(video,sx,sy,sw,sh,0,0,bandCv.width,bandCv.height);return bandCv}
function grabWindow(video,full){
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw)return null;
  if(full){const sc=Math.min(1,1000/vw);scanCv.width=vw*sc;scanCv.height=vh*sc;scanCtx.drawImage(video,0,0,scanCv.width,scanCv.height);return scanCv}
  const box=video.getBoundingClientRect(),win=$('#scan .win').getBoundingClientRect();
  const k=Math.max(box.width/vw,box.height/vh),ox=(vw*k-box.width)/2,oy=(vh*k-box.height)/2;
  let sx=(win.left-box.left+ox)/k,sy=(win.top-box.top+oy)/k,sw=win.width/k,sh=win.height/k;
  const px=sw*.15,py=sh*.35;sx=Math.max(0,sx-px);sy=Math.max(0,sy-py);sw=Math.min(vw-sx,sw+2*px);sh=Math.min(vh-sy,sh+2*py);
  const sc=Math.min(1.5,900/sw);scanCv.width=Math.round(sw*sc);scanCv.height=Math.round(sh*sc);
  scanCtx.drawImage(video,sx,sy,sw,sh,0,0,scanCv.width,scanCv.height);return scanCv}
async function scanOpen(){
  if(!S.me){openLogin('Kitap eklemek için giriş yap');return}
  closeSheet();$('#scan').hidden=false;scanMsg('Barkodları sırayla çerçeveye getir, ekran kapanmaz');scanning=true;
  BATCH.items=[];BATCH.seen=new Set();BATCH.cool=0;$('#scanIsbnForm').classList.add('hide');drawBatch();
  try{BATCH.ac=BATCH.ac||new (window.AudioContext||window.webkitAudioContext)();BATCH.ac.resume&&BATCH.ac.resume()}catch(e){}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#scanMsg').textContent='Bu tarayıcı kameraya erişemiyor. Fotoğraftan okuyabilir ya da ISBN yazabilirsin.';return}
  const video=$('#scanVideo');
  try{
    const D=await getDetector();
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(!scanning){stream.getTracks().forEach(t=>t.stop());return}
    video.srcObject=stream;await video.play().catch(()=>{});track=stream.getVideoTracks()[0];torchUi();
    try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    zoomUi();

    const accept=c=>{if(c===last)hits++;else{last=c;hits=1}if(hits>=2)onCode(c)};
    const loop=async()=>{if(!scanning)return;n++;
      try{let c=null;
        if(D.kind==='native'){const r=await D.d.detect(video);c=(r.map(x=>x.rawValue).find(validIsbn))||null}
        else if(D.kind==='wasm'){const cv=grabBand(video,n%3);if(cv){const r=await D.d.detect(cv);c=(r.map(x=>x.rawValue).find(validIsbn))||null}}
        else if(window.ZXing){const cv=grabWindow(video,n%6===0);if(cv)c=zxDecodeCanvas(cv)}
        if(c)D.kind==='js'?accept(c):onCode(c)}catch(e){}
      if(scanning)setTimeout(loop,D.kind==='js'?60:D.kind==='wasm'?30:90)};
    loop();
    setTimeout(()=>{if(scanning&&!BATCH.items.length)scanMsg('Okumadıysa telefonu biraz uzaklaştır, barkod net ve düz görünsün. Gerekirse fener aç.')},9000);
  }catch(e){console.warn(e);$('#scanMsg').textContent=e&&e.name==='NotAllowedError'?'Kamera izni verilmedi. Ayarlar › Safari › Kamera’dan izin ver ya da fotoğraftan oku.':'Kamera açılamadı. Fotoğraftan okuyabilir ya da ISBN yazabilirsin.'}
}

function scanMsg(t,cls){const m=$('#scanMsg');m.textContent=t;m.className=cls||''}
function drawBatch(){
  $('#scanSt').innerHTML=Object.entries(DURUM).map(([k,t])=>`<button class="${BATCH.durum===k?'on':''}" data-act="scanSt" data-s="${k}">${t}</button>`).join('');

function onCode(code){
  if($('#scan').hidden)return;
  const now=Date.now();if(now<BATCH.cool)return;
  if(BATCH.seen.has(code)){if(code!==BATCH.lastCode&&now-(BATCH.lastDup||0)>2500){BATCH.lastDup=now;BATCH.lastCode=code;const it=BATCH.items.find(x=>x.isbn===code);scanMsg(`Bu kitabı zaten okuttun${it&&it.info?': '+it.info.baslik:''}`,'warn')}return}
  BATCH.seen.add(code);BATCH.lastCode=code;BATCH.cool=now+1200;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}beep();
  const f=$('#scanFlash');f.style.opacity=.55;setTimeout(()=>f.style.opacity=0,160);
  const it={i:BATCH.items.length,isbn:code,st:'ara',info:null,row:null};BATCH.items.push(it);drawBatch();scanMsg('ISBN '+code+' aranıyor…');

async function resolveItem(it){
  const ex=S.lib.find(b=>b.isbn===it.isbn);
  if(ex){it.st='var';it.info=ex;it.row=ex;drawBatch();scanMsg(`“${ex.baslik}” zaten kitaplığında`,'warn');return}
  let r=null;try{r=await lookupIsbn(it.isbn)}catch(e){}
  if(!r||!r.baslik){it.st='yok';drawBatch();scanMsg(`ISBN ${it.isbn} bulunamadı, bitince elle ekleyebilirsin`,'warn');return}
  it.info=r;const ex2=inLib(keyOf(r.baslik,r.yazar));
  if(ex2){it.st='var';it.row=ex2;drawBatch();scanMsg(`“${r.baslik}” zaten kitaplığında`,'warn');return}
  const row=await addRowQuiet(r,BATCH.durum);
  if(row){it.st='ok';it.row=row;drawBatch();scanMsg(`✓ ${r.baslik} eklendi`,'ok')}else{it.st='yok';it.err=true;drawBatch();scanMsg('Eklenemedi: '+(BATCH.lastErr||''),'warn')}}
async function addRowQuiet(x,durum){

async function trayItem(i){const it=BATCH.items[i];if(!it)return;

async function decodePhoto(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const D=await getDetector();if(D.d){try{const r=await D.d.detect(img);const c=r.map(x=>x.rawValue).find(validIsbn);if(c)return c}catch(e){}}

  for(const max of[1400,900,2200,640])for(const rot of[0,1]){const W=img.naturalWidth,H=img.naturalHeight,sc=Math.min(1,max/Math.max(W,H)),w=Math.round(W*sc),h=Math.round(H*sc);const c=document.createElement('canvas');c.width=rot?h:w;c.height=rot?w:h;const x=c.getContext('2d');if(rot){x.translate(h,0);x.rotate(Math.PI/2)}x.drawImage(img,0,0,w,h);

async function audioSave(btn){

  if(!row.baslik){toast('Kitap adı gerekli');return}const id=btn.dataset.id;const log=m=>$('#aLog').textContent=m;btn.disabled=true;
  if(!id&&!FORM.files.length){toast('En az bir ses dosyası seç');btn.disabled=false;return}
  try{
    if(FORM.coverFile){log('Kapak yükleniyor');const p=`kapaklar/${Date.now().toString(36)}-${safeName(FORM.coverFile.name)}`;const u=await sb.storage.from(BUCKET).upload(p,FORM.coverFile,{contentType:FORM.coverFile.type});if(!u.error)FORM.kapak=sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl}
    row.kapak=keepUrl(FORM.kapak)||null;
    let kid=id;
    if(id){const{error}=await sb.from('sesli_kitaplar').update(row).eq('id',id);if(error)throw error}
    else{const{data,error}=await sb.from('sesli_kitaplar').insert(row).select().single();if(error)throw error;kid=data.id;await uploadChapters(kid,FORM.files,0,log)}
    await loadAudio();toast(id?'Kaydedildi':'Sesli kitap yayınlandı');if(id&&R.name==='sesliKitap'&&R.arg===kid){closeSheet();render()}else openAudio(kid);
  }catch(e){console.error(e);toast('Hata: '+(e.message||'kaydedilemedi'));btn.disabled=false;log('')}}
async function audioDelete(id){const a=S.audio.find(x=>x.id===id);if(!a)return;
  const paths=a.bolumler.map(b=>b.dosya_yolu);if(paths.length)await sb.storage.from(BUCKET).remove(paths);
  const{error}=await sb.from('sesli_kitaplar').delete().eq('id',id);if(error){toast('Silinemedi');return}
  if(P.id===id){audio.pause();audio.removeAttribute('src');P.id=null}await loadAudio();toast('Silindi');go('#/sesli')}

/* ==================== oynatıcı ==================== */
const audio=$('#audio');const P={id:null,ch:0,rate:+localStorage.getItem('kv.rate')||1,sleepAt:0,sleepT:null};
function playA(id,ch,fromStart){const a=S.audio.find(x=>x.id===id);if(!a||!a.bolumler.length){toast('Bu kitapta bölüm yok');return}
  const p=S.prog[id];if(ch==null)ch=p&&!p.bitti?Math.min(p.bolum,a.bolumler.length-1):0;
  if(P.id&&(P.id!==id||P.ch!==ch))persistPos();
  const same=P.id===id&&P.ch===ch&&audio.src;P.id=id;P.ch=ch;
  if(!same){audio.src=safeUrl(a.bolumler[ch].dosya_url)||a.bolumler[ch].dosya_url;const st=fromStart?0:(p&&!p.bitti&&p.bolum===ch?p.saniye:0);
    audio.addEventListener('loadedmetadata',function f(){audio.removeEventListener('loadedmetadata',f);if(st&&st<audio.duration-3)audio.currentTime=st},{once:true})}
  audio.playbackRate=P.rate;audio.play().catch(()=>toast('Oynatmak için tekrar dokun'));
  try{if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:a.bolumler[ch].baslik||a.baslik,artist:a.yazar||'',album:a.baslik,artwork:safeUrl(a.kapak)?[{src:safeUrl(a.kapak),sizes:'480x720'}]:[]});
    navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
    navigator.mediaSession.setActionHandler('seekbackward',()=>skip(-15));navigator.mediaSession.setActionHandler('seekforward',()=>skip(30));
    navigator.mediaSession.setActionHandler('nexttrack',()=>P.ch<a.bolumler.length-1&&playA(id,P.ch+1,true));navigator.mediaSession.setActionHandler('previoustrack',()=>P.ch>0&&playA(id,P.ch-1,true))}}catch(e){}
  updateMini();refreshPlayer()}
function persistPos(){if(P.id&&audio.src)saveProg(P.id,P.ch,audio.currentTime||0,false)}
function skip(s){if(audio.duration)audio.currentTime=Math.max(0,Math.min(audio.duration-.5,audio.currentTime+s))}
audio.addEventListener('pause',()=>{persistPos();updateMini();refreshPlayer()});
audio.addEventListener('play',()=>{updateMini();refreshPlayer()});
audio.addEventListener('ended',()=>{const a=S.audio.find(x=>x.id===P.id);if(!a)return;if(P.ch<a.bolumler.length-1)playA(a.id,P.ch+1,true);else{saveProg(a.id,0,0,true);toast('Kitabı bitirdin');updateMini();refreshPlayer()}});
let lastTick=0,lastSave=0;audio.addEventListener('timeupdate',()=>{const n=Date.now();if(n-lastTick>400){lastTick=n;updateMini(true);refreshPlayer(true)}if(n-lastSave>20000&&!audio.paused){lastSave=n;persistPos()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistPos()});
function updateMini(light){const m=$('#mini');const a=P.id&&S.audio.find(x=>x.id===P.id);if(!a){m.hidden=true;return}m.hidden=false;
  $('#miniPg').style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%';$('#miniS').textContent=`${a.bolumler[P.ch]?.baslik||''} · ${fmtT(audio.currentTime)}`;
  if(light)return;$('#miniCv').innerHTML=cover(a,32);$('#miniT').textContent=a.baslik;$('#miniBtn').innerHTML=audio.paused?I.play:I.pause}
function openPlayer(){const a=S.audio.find(x=>x.id===P.id);if(!a)return;
  sheet(`<div class="player"><div class="cvw">${cover(a,190)}</div><h2>${esc(a.baslik)}</h2><div class="muted" style="margin-top:4px">${esc(a.yazar||'')}</div><div id="plCh" class="small" style="color:var(--ac);margin-top:4px"></div>
  <input type="range" id="plSeek" min="0" max="1000" value="0" style="margin-top:20px" data-inp="seek"><div class="times"><span id="plC">0:00</span><span id="plR">-0:00</span></div>
  <div class="ctl"><button class="skp" data-act="skip" data-s="-15">${I.rew}<em>15</em></button><button class="big" data-act="toggle" id="plBtn"></button><button class="skp" data-act="skip" data-s="30">${I.ffw}<em>30</em></button></div>
  <div class="row" style="justify-content:center;gap:8px"><button class="chip2" data-act="rate" id="plRate">${P.rate}×</button><button class="chip2" data-act="sleep" id="plSleep">Uyku</button></div>
  <div style="text-align:left;margin-top:22px">${a.bolumler.map((b,i)=>`<button class="ch ${i===P.ch?'on':''}" data-act="playCh" data-id="${a.id}" data-i="${i}"><span class="n">${i+1}</span><span>${esc(b.baslik||'Bölüm '+(i+1))}</span><small>${b.sure?fmtT(b.sure):''}</small></button>`).join('')}</div></div>`,'player','Şimdi çalıyor','Küçült');refreshPlayer()}
function refreshPlayer(light){if(S.sheet!=='player')return;const a=S.audio.find(x=>x.id===P.id);if(!a)return;const s=$('#plSeek');
  if(s&&document.activeElement!==s)s.value=audio.duration?audio.currentTime/audio.duration*1000:0;$('#plC').textContent=fmtT(audio.currentTime);$('#plR').textContent='-'+fmtT((audio.duration||0)-audio.currentTime);
  if(light)return;$('#plBtn').innerHTML=audio.paused?I.play:I.pause;$('#plCh').textContent=`Bölüm ${P.ch+1} / ${a.bolumler.length}`;
  $('#plSleep').textContent=P.sleepAt?`Uyku · ${Math.max(1,Math.round((P.sleepAt-Date.now())/60000))} dk`:'Uyku';
  document.querySelectorAll('.player .ch').forEach((el,i)=>el.classList.toggle('on',i===P.ch))}

let LOCAL=false;
async function start(){
  Object.assign(R,parseRoute());
  const cfg=AYAR.SUPABASE_URL&&AYAR.SUPABASE_ANON_KEY&&window.supabase;
  if(cfg)sb=supabase.createClient(AYAR.SUPABASE_URL,AYAR.SUPABASE_ANON_KEY);
  else{LOCAL=true;await preloadBlobs();sb=localClient()}
  const{data:{session}}=await sb.auth.getSession();
  await onUser(session&&session.user);
  sb.auth.onAuthStateChange((ev,s)=>{const u=s&&s.user;if((u&&u.id)!==(S.me&&S.me.id))onUser(u)});
}

/* ==================== YEREL MOD (Supabase yokken) ====================
   Supabase ayarı girilmemişse aynı uygulama tarayıcıda çalışır:
   veriler localStorage'da, ses ve kapak dosyaları IndexedDB'de durur. */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('kitapligim-yerel',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDo(mode,fn){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('f',mode);const out=fn(t.objectStore('f'));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})}
async function preloadBlobs(){try{const d=await idbOpen();await new Promise(res=>{const c=d.transaction('f').objectStore('f').openCursor();c.onsuccess=()=>{const cur=c.result;if(!cur)return res();BLOBURL[cur.key]=URL.createObjectURL(cur.value);cur.continue()};c.onerror=()=>res()})}catch(e){}}
function localClient(){
  const K='kv.yerel.',uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  const load=t=>{try{return JSON.parse(localStorage.getItem(K+t)||'[]')}catch(e){return[]}};
  const save=(t,a)=>{try{localStorage.setItem(K+t,JSON.stringify(a))}catch(e){toast('Tarayıcı depolama alanı doldu')}};
  const now=()=>new Date().toISOString();
  const USER={id:'yerel',email:AYAR.ADMIN_EMAIL,user_metadata:{full_name:'Ben'}};
  function stats(){const g={};load('kitaplik').forEach(r=>{const x=g[r.anahtar]||(g[r.anahtar]={anahtar:r.anahtar,baslik:r.baslik,yazar:r.yazar,kapak:r.kapak,isbn:r.isbn,okuyan:0,toplam:0,_s:0,puan_sayisi:0});
    x.toplam++;if(r.durum==='okudum')x.okuyan++;if(r.puan>0){x._s+= +r.puan;x.puan_sayisi++}if(!x.kapak&&r.kapak)x.kapak=r.kapak});
    return Object.values(g).map(x=>({...x,ort_puan:x.puan_sayisi?Math.round(x._s/x.puan_sayisi*100)/100:null}))}
  function qb(t){let op='select',pay=null,sel='*',single=false,lim=null;const F=[],O=[];
    const o={select(x){if(op==='select')sel=x||'*';return o},eq(c,v){F.push(r=>r[c]===v);return o},neq(c,v){F.push(r=>r[c]!==v);return o},in(c,arr){F.push(r=>arr.includes(r[c]));return o},or(expr){const fs=expr.split(',').map(x=>{const[c,,...v]=x.split('.');const p=v.join('.');const re=new RegExp('^'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*')+'$','i');return r=>re.test(r[c]||'')});F.push(r=>fs.some(f=>f(r)));return o},ilike(c,p){const re=new RegExp('^'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*')+'$','i');F.push(r=>re.test(r[c]||''));return o},gt(c,v){F.push(r=>(+r[c]||0)>v);return o},
      not(c){F.push(r=>r[c]!=null);return o},order(c,p){O.push([c,p&&p.ascending===false?-1:1]);return o},limit(n){lim=n;return o},maybeSingle(){single=true;return o},single(){single=true;return o},
      insert(r){op='insert';pay=r;return o},update(r){op='update';pay=r;return o},delete(){op='delete';return o},upsert(r){op='upsert';pay=r;return o},
      then(res,rej){return Promise.resolve().then(()=>{let out;try{out=run()}catch(e){console.error(e);out={data:null,error:{message:String(e)}}}return out}).then(res,rej)}};
    const match=r=>F.every(f=>f(r));
    function run(){
      if(t==='kitap_istatistik'){let a=stats().filter(match);a=sortLim(a);return{data:single?(a[0]||null):a,error:null}}
      let a=load(t);
      if(op==='insert'){const row={id:uid(),created_at:now(),updated_at:now(),...(t==='kitaplik'?{user_id:'yerel',yorum_acik:true,favori:false,mevcut_sayfa:0}:{}),...pay};if(t==='profiller')row.id=pay.id;a.push(row);save(t,a);return{data:single?row:[row],error:null}}
      if(op==='update'){a.forEach(r=>{if(match(r))Object.assign(r,pay)});save(t,a);return{data:null,error:null}}
      if(op==='delete'){const gone=a.filter(match).map(r=>r.id);save(t,a.filter(r=>!match(r)));
        if(t==='sesli_kitaplar'){save('sesli_bolumler',load('sesli_bolumler').filter(b=>!gone.includes(b.kitap_id)));save('dinleme',load('dinleme').filter(b=>!gone.includes(b.kitap_id)))}return{data:null,error:null}}
      if(op==='upsert'){const kf=t==='dinleme'?(r=>r.user_id===pay.user_id&&r.kitap_id===pay.kitap_id):(r=>r.id===pay.id);const ex=a.find(kf);if(ex)Object.assign(ex,pay);else a.push({...pay});save(t,a);return{data:null,error:null}}
      a=sortLim(a.filter(match)).map(r=>({...r}));
      if(sel.includes('sesli_bolumler')){const B=load('sesli_bolumler');a.forEach(r=>r.sesli_bolumler=B.filter(b=>b.kitap_id===r.id))}
      if(sel.includes('profiller')){const P=load('profiller');a.forEach(r=>r.profiller=P.find(p=>p.id===r.user_id)||null)}
      return{data:single?(a[0]||null):a,error:null}}
    function sortLim(a){if(O.length)a.sort((x,y)=>{for(const[c,d]of O){const p=x[c]??'',q=y[c]??'';if(p<q)return -d;if(p>q)return d}return 0});return lim?a.slice(0,lim):a}
    return o}
  return{from:qb,
    auth:{getSession:async()=>({data:{session:{user:USER}}}),onAuthStateChange(){},signOut:async()=>({}),signInWithOAuth:async()=>({error:{message:'yerel'}}),signInWithOtp:async()=>({error:{message:'yerel'}})},
    storage:{from:b=>({
      upload:async(path,file)=>{const k=b+'/'+path;try{await idbDo('readwrite',s=>s.put(file,k));BLOBURL[k]=URL.createObjectURL(file);return{data:{path},error:null}}catch(e){return{data:null,error:{message:'Cihazda yer yok'}}}},
      getPublicUrl:path=>({data:{publicUrl:'idb:'+b+'/'+path}}),
      remove:async paths=>{for(const p of paths){const k=b+'/'+p;try{await idbDo('readwrite',s=>s.delete(k))}catch(e){}if(BLOBURL[k])URL.revokeObjectURL(BLOBURL[k]);delete BLOBURL[k]}return{error:null}}})}};
}
async function onUser(u){S.me=u?{id:u.id,email:u.email}:null;S.libLoaded=false;render();
  await healthCheck();
  if(u&&!S.dbErr){await ensureProfile(u);if(S.sheet==='login')closeSheet()}else if(!u)S.profile=null;
  S.USERS={};S.feed=null;await Promise.all([loadLib(),loadProg(),loadFollowing()]);render();
  let later=false;try{later=!!sessionStorage.getItem('kv.kadiSonra')}catch(e){}
  if(u&&!LOCAL&&!S.dbErr&&S.profile&&('kullanici_adi' in S.profile)&&!S.profile.kullanici_adi&&!later&&!S.sheet)askKadi()}
start();
</script>
